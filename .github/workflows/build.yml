name: Build APK with V2Ray
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Android NDK and platform
        shell: bash
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-34"
      - name: Build Xray core Android library
        shell: bash
        run: |
          git clone --depth 1 https://github.com/2dust/AndroidLibXrayLite.git /tmp/AndroidLibXrayLite
          cd /tmp/AndroidLibXrayLite
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          gomobile init
          go mod tidy -v
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          gomobile bind -v -androidapi 24 -target=android/arm64,android/arm -trimpath -ldflags='-s -w -buildid= -checklinkname=0' -o "$GITHUB_WORKSPACE/app/libs/libv2ray.aar" .
          ls -la "$GITHUB_WORKSPACE/app/libs"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo "=========== ERRORS ==========="
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -60
          echo "=========== END ERRORS ==========="
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: Redo-VPN-apk
          path: app/build/outputs/apk/debug/app-debug.apk
